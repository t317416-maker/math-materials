<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数直線対戦計算ゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-board">
        <!-- プレイヤー1のエリア（左） -->
        <div class="player-zone player-zone-left" id="player-zone-0">
            <div class="player-area">
                <div class="player-header">
                    <h2>🔴 プレイヤー1</h2>
                </div>
                <div class="player-game-space" id="game-space-0"></div>
            </div>
        </div>

        <!-- 中央エリア -->
        <div class="center-area">
            <!-- タイトル -->
            <div class="title-section">
                <h1>🎯 数直線対戦計算ゲーム</h1>
            </div>

            <!-- ゲーム情報 -->
            <div class="game-info">
                <div class="info-item">
                    <div class="info-label">ターン</div>
                    <div class="info-value" id="turn-display">1 / 10</div>
                </div>
                <div class="info-item">
                    <div class="info-label">目的地駅</div>
                    <div class="info-value" id="target-station-display">-16</div>
                </div>
            </div>

            <!-- 数直線エリア -->
            <div class="number-line-container">
                <div class="number-line" id="number-line">
                    <div class="line"></div>
                    <div class="scale-labels">
                        <span>-20</span>
                        <span>-10</span>
                        <span>0</span>
                        <span>+10</span>
                        <span>+20</span>
                    </div>
                </div>
            </div>

            <!-- スコアボード -->
            <div class="scoreboard">
                <div id="scoreboard-container"></div>
            </div>
        </div>

        <!-- プレイヤー2のエリア（下） -->
        <div class="player-zone player-zone-bottom" id="player-zone-1">
            <div class="player-area">
                <div class="player-header">
                    <h2>🔵 プレイヤー2</h2>
                </div>
                <div class="player-game-space" id="game-space-1"></div>
            </div>
        </div>

        <!-- プレイヤー3のエリア（右） -->
        <div class="player-zone player-zone-right" id="player-zone-2">
            <div class="player-area">
                <div class="player-header">
                    <h2>🟢 プレイヤー3</h2>
                </div>
                <div class="player-game-space" id="game-space-2"></div>
            </div>
        </div>

        <!-- 共通ゲームエリア（初期画面・カード選択など） -->
        <div class="common-game-area" id="common-game-area"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
