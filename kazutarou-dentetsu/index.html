<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数直線対戦計算ゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- タイトル -->
        <h1>🎯 数直線対戦計算ゲーム</h1>

        <!-- ゲーム情報 -->
        <div class="game-info">
            <div class="info-item">
                <div class="info-label">ターン</div>
                <div class="info-value" id="turn-display">1 / 10</div>
            </div>
            <div class="info-item">
                <div class="info-label">現在のプレイヤー</div>
                <div class="info-value" id="current-player-display">プレイヤー1</div>
            </div>
            <div class="info-item">
                <div class="info-label">目的地駅</div>
                <div class="info-value" id="target-station-display">-16</div>
            </div>
        </div>

        <!-- 数直線エリア -->
        <div class="number-line-container">
            <div class="number-line" id="number-line">
                <div class="line"></div>
                <div class="scale-labels">
                    <span>-20</span>
                    <span>-10</span>
                    <span>0</span>
                    <span>+10</span>
                    <span>+20</span>
                </div>
            </div>
        </div>

        <!-- スコアボード -->
        <div class="scoreboard">
            <h3>📊 スコアボード</h3>
            <div id="scoreboard-container"></div>
        </div>

        <!-- カードエリア -->
        <div class="cards-container">
            <div class="cards-title">🎴 手札</div>
            <div id="cards-display">カードなし</div>
        </div>

        <!-- ゲームエリア -->
        <div class="game-area" id="game-area">
            <!-- ゲームの状態に応じて動的に変化 -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
